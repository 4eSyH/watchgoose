# Сбор метрик инфраструктуры (16.1).
# Система обязана мониторить себя через тот же контур: если ingest захлебнулся,
# должен сработать алерт, а не тишина, которую примут за отсутствие проблем.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: nodes
    static_configs:
      - targets: ['node-exporter:9100']

  # ⚠️ Порт 9090, а не 8080 — это не опечатка.
  #
  # /metrics вынесен с общего порта API на отдельный слушатель
  # (WATCHGOOSE_SERVER_METRICS_ADDR в docker-compose.yml): проверку доступа
  # на него не поставить — vmagent токена не носит, — а отдаёт он перечень
  # сервисов, объёмы логов по уровням и состояние детекторов. Наружу этот
  # порт не публикуется, ходит сюда только vmagent по внутренней сети.
  # На 8080 маршрута /metrics больше нет: цель, оставленная на нём,
  # молча даст 404, и мониторинг самой системы просто исчезнет.
  - job_name: watchgoose
    static_configs:
      - targets: ['watchgoose:9090']

  - job_name: infra
    static_configs:
      - targets:
          # ⚠️ Manticore здесь БОЛЬШЕ НЕТ, и это не потеря.
          #
          # Порт 9308 — её HTTP-приёмник запросов, а не отдача метрик:
          # на /metrics он отвечает 404 с «no such index [metrics]».
          # Prometheus-эндпоинта у Manticore нет вовсе, состояние она
          # отдаёт только через SHOW STATUS по SQL. Цель стояла тут
          # с самого начала и всё это время была вечно недоступной —
          # то есть держала алерт «служба недоступна» постоянно зажжённым.
          #
          # Что происходит с логами, видно по метрикам самого watchgoose:
          # watchgoose_ingest_records_total, _dropped_total, глубина
          # очереди и прогноз хранения. Их и собираем, задание watchgoose.
          - 'clickhouse:9363'
          - 'postgres-exporter:9187'
          # ⚠️ VictoriaMetrics обязана собирать САМА СЕБЯ.
          #
          # Без этого нет ряда vm_data_size_bytes — единственного способа
          # узнать, сколько места занимают метрики: каталог с данными лежит
          # внутри её контейнера и снаружи не виден. Хранилище, которое
          # нельзя измерить, нельзя и уместить в бюджет: доля метрик
          # оставалась бы гаданием.
          - 'victoria:8428'

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

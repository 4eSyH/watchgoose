# OpenTelemetry Collector — единая точка приёма и роутинг сигналов (12.2).
#
#   логи    → watchgoose (fingerprint, детекторы, знание)
#   трейсы  → ClickHouse напрямую + spanmetrics
#   метрики → VictoriaMetrics

receivers:
  otlp:
    protocols:
      # ⚠️ Приёмник ЗАКРЫТ ТОКЕНОМ.
      #
      # Без этого коллектор принимал что угодно от кого угодно: проверено
      # запросом без заголовка — отвечал 200. При этом watchgoose на такой же
      # запрос отвечает 401, но толку от этого не было никакого: напрямую
      # в него никто не пишет, все шлют сюда.
      #
      # Получалось отмывание: неаутентифицированный вход превращался
      # в аутентифицированный, потому что дальше коллектор подставлял
      # валидный токен сам. Чужие логи заводили инциденты, чужие метрики
      # и трейсы уходили в ClickHouse и VictoriaMetrics, где проверок нет
      # вовсе, а поток достаточного объёма вытеснял настоящие данные
      # по бюджету хранения.
      grpc:
        endpoint: 0.0.0.0:4317
        auth: {authenticator: bearertokenauth/ingest}
      http:
        endpoint: 0.0.0.0:4318
        auth: {authenticator: bearertokenauth/ingest}

processors:
  batch:
    timeout: 1s
    send_batch_size: 5000
    send_batch_max_size: 10000
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  # ⚠️ Идентификатор в имени операции — главный способ уронить хранилище
  # метрик.
  #
  # `GET /orders/8891` вместо `GET /orders/:id` порождает отдельный ряд
  # на КАЖДЫЙ заказ. Один сервис с непошаблоненным маршрутом даёт больше
  # рядов, чем весь остальной флот вместе взятый, и обнаруживается это
  # по исчерпанию места, а не по ошибке.
  #
  # Предел словаря измерений тут не помогает: он обрезает данные, оставляя
  # причину. Шаблонизация лечит причину.
  #
  # ⚠️ Применяется ТОЛЬКО к ветке метрик, не к спанам в ClickHouse.
  # Там имя нужно как есть: по нему ищут конкретный запрос конкретного
  # заказа, и подменять его ради формы метрик означало бы испортить
  # первичные данные ради производной.
  transform/span-names:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # Порядок важен: UUID содержит цифры и должен пройти первым,
          # иначе числовое правило разрежет его на куски.
          - replace_pattern(name, "/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", "/:uuid")
          - replace_pattern(name, "/[0-9a-fA-F]{24,}", "/:hash")
          - replace_pattern(name, "/[0-9]+", "/:id")

  # ⚠️ Режем только заведомый мусор. Вероятностного сэмплирования здесь НЕТ:
  # по сэмплу нельзя считать агрегаты, а аналитика по трейсам — равноправный
  # первичный сценарий (раздел 3).
  filter/drop-noise:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.route"] == "/healthz"'
        - 'attributes["http.route"] == "/readyz"'
        - 'attributes["http.route"] == "/metrics"'
        - 'attributes["http.route"] == "/favicon.ico"'

connectors:
  # Метрики по 100% спанов, до любых фильтров: точные RPS, p50/p95/p99
  # и доля ошибок по каждой операции. Дашборды живут на них и отвечают
  # мгновенно, в ClickHouse проваливаются только за конкретикой.
  spanmetrics:
    histogram:
      explicit:
        buckets: [1ms, 10ms, 50ms, 100ms, 500ms, 1s, 5s, 30s]
    # ⚠️ Каждое измерение УМНОЖАЕТ число рядов, а не добавляет их.
    #
    # Ряд строится на сочетание сервиса, операции, статуса и всего
    # перечисленного здесь. Прикидка на тысяче сервисов:
    #
    #   1000 сервисов × 20 операций                       = 20 000
    #   × статус (5) × region (5) × point_type (5)        = 125
    #   × рядов гистограммы (~11)              до 27 млн рядов
    #
    # Без region и point_type остаётся 1,1 млн — в двадцать раз меньше.
    # Разрез по региону и типу точки никуда не девается: сами спаны лежат
    # в ClickHouse со всеми атрибутами, и там он бесплатен. В метриках
    # он стоит двадцатикратно, а VictoriaMetrics, по её собственному
    # устройству, ограничивать себя по объёму не умеет.
    #
    # Вернуть измерение сюда можно в любой момент — но только вместе
    # с пределом рядов у VictoriaMetrics и тревогой на приближение к нему.
    dimensions:
      - name: http.status_code

exporters:
  # ⚠️ Логи идут в watchgoose по gRPC на 4317, а не по HTTP на 4318.
  #
  # Приёмник у watchgoose один — gRPC. Это тот же порт и тот же протокол,
  # которым приложения шлют трассировки и метрики: один адрес на всё,
  # без второго транспорта и без склейки адреса заменой цифры в порту.
  #
  # tls.insecure здесь честно: связь идёт по внутренней сети compose,
  # наружу этот порт watchgoose не публикует вовсе.
  otlp/logs:
    endpoint: watchgoose:4317
    tls:
      insecure: true
    # ⚠️ Приёму нужен токен роли ingest, иначе он отвечает 401 и логи
    # не доходят вообще. Секрет один и тот же с обеих сторон: здесь
    # INGEST_TOKEN — выпустите его командой
    #   watchgoose --issue-token=otel-collector --token-role=ingest
    # Пустая переменная означает открытый приём — тогда заголовок ни на что
    # не влияет и мешать не будет.
    headers:
      authorization: "Bearer ${env:INGEST_TOKEN}"
    sending_queue:
      enabled: true
      storage: file_storage      # буфер на диске при падении бэкенда
      num_consumers: 4
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      # ⚠️ Ноль означает «повторять, пока пачка лежит в очереди», и это
      # НЕ бесконечное ожидание: границу задаёт queue_size выше.
      #
      # Раньше здесь стояло 10m, и это обесценивало саму очередь. Исчерпав
      # своё время, экспортёр снимает пачку окончательно — дисковый буфер
      # её не спасает, он защищает от перезапуска коллектора, а не от
      # долгой недоступности приёмника.
      #
      # Считано на рабочем профиле: при пике 50 000 записей/с и сливе
      # 35 000/с дефицит составляет 15 000/с, а очередь на 5000 пачек
      # вмещает 28 минут такого дефицита. Пользоваться можно было десятью.
      #
      # ⚠️ Границу потерь обязано задавать ОДНО место. Пусть это будет
      # размер очереди: он явный, виден на диске и растёт вместе с ней.
      # Два независимых предела всегда сводятся к меньшему, и меньший
      # тут был выбран случайно.
      max_elapsed_time: 0

  clickhouse/traces:
    endpoint: tcp://clickhouse:9000
    database: otel
    username: watchgoose
    password: ${env:CH_PASS}
    traces_table_name: otel_traces
    ttl: 2160h                   # 90 дней (16.6), retention декларативно
    create_schema: true          # схему создаёт экспортёр
    timeout: 10s
    sending_queue:
      enabled: true
      # ⚠️ Очередь на ДИСКЕ, как у логов.
      #
      # Была только в памяти, и перезапуск коллектора — обновление, смена
      # конфигурации, нехватка памяти — терял все спаны, лежащие в ней.
      # Расхождение с логами выглядело незамеченным: пояснений к нему
      # не было, тогда как остальное здесь прокомментировано.
      #
      # Терять их особенно обидно на всплеске: спанов в очереди тогда
      # больше всего, а разбирать потом будут именно этот всплеск.
      storage: file_storage
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      # По той же причине, что у логов: границу задаёт очередь.
      max_elapsed_time: 0

  prometheusremotewrite/metrics:
    endpoint: http://victoria:8428/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  file_storage:
    directory: /var/lib/otelcol
  health_check:
    endpoint: 0.0.0.0:13133

  # ⚠️ Тот же токен, что предъявляет сам коллектор, когда пишет
  # в watchgoose. Один секрет на весь путь телеметрии: разъедутся —
  # отправители получат 401 на входе, и это будет видно сразу,
  # а не обнаружится через неделю по пустому поиску.
  bearertokenauth/ingest:
    scheme: Bearer
    token: ${env:INGEST_TOKEN}

service:
  extensions: [file_storage, health_check, bearertokenauth/ingest]
  telemetry:
    logs: {level: info}
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/logs]
    # ⚠️ Трассировки идут ДВУМЯ ветками из одного приёмника.
    #
    # Раньше была одна: спаны уходили в ClickHouse и в spanmetrics вместе.
    # Разделить пришлось из-за шаблонизации имён — метрикам нужен
    # `GET /orders/:id`, а хранилищу спанов `GET /orders/8891`, потому что
    # по нему потом и ищут. Общая ветка заставила бы выбрать одно из двух.
    #
    # Приёмник раздаёт копию каждой ветке сам; разбор запроса при этом
    # не повторяется, дублируется только обработка.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop-noise, batch]
      exporters: [clickhouse/traces]

    traces/spanmetrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop-noise, transform/span-names, batch]
      exporters: [spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite/metrics]

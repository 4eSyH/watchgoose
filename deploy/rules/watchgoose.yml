# Тревоги о самой системе наблюдаемости.
#
# ⚠️ Раньше правил не было ни одного, и это обесценивало все метрики.
#
# Требование записано в шапке scrape.yml дословно: «если ingest захлебнулся,
# должен сработать алерт, а не тишина, которую примут за отсутствие проблем».
# Метрики собирались и агрегировались, оценивать их было некому.
#
# ⚠️ Самонаблюдение НЕ идёт через наблюдаемую систему.
#
# Тревога о том, что watchgoose недоступен, не может проходить через его же
# движок инцидентов: он в этот момент и не работает. Поэтому правила живут
# в vmalert и уходят во внешний приёмник напрямую.
#
# ⚠️ Пороги подобраны под рваную нагрузку: пик в десятки тысяч записей
# в секунду при спокойном фоне в сотни. Отказы приёма на таком профиле —
# ШТАТНОЕ поведение обратного давления, а не сбой, поэтому будят не они,
# а отставание, которое не рассасывается.

groups:
  # ── Приём ────────────────────────────────────────────────────────────
  - name: watchgoose-ingest
    interval: 30s
    rules:
      - alert: ПриёмЗамолчал
        # ⚠️ Главное правило всего файла.
        #
        # Ловит ровно тот случай, который никак иначе не обнаруживается:
        # логи перестали доходить, а система об этом молчит, потому что
        # молчание и есть симптом. Условие «поток был и стал нулевым»
        # отличает поломку от выходных.
        expr: |
          sum(rate(watchgoose_ingest_records_total[10m])) == 0
          and
          sum(rate(watchgoose_ingest_records_total[6h] offset 10m)) > 0
        for: 10m
        labels: {severity: critical, component: ingest}
        annotations:
          summary: "Приём логов остановился"
          description: >-
            За десять минут не принято ни одной записи, хотя последние
            шесть часов поток был. Смотреть по порядку: жив ли коллектор,
            сходится ли INGEST_TOKEN с обеих сторон, отвечает ли Manticore.

      - alert: ЗаписиОтбрасываются
        # Порога нет намеренно: любая потеря — событие, а не величина.
        # Отказ источнику (Unavailable) сюда НЕ попадает — это другая
        # метрика и другое поведение.
        expr: sum(rate(watchgoose_ingest_dropped_total[5m])) > 0
        for: 2m
        labels: {severity: critical, component: ingest}
        annotations:
          summary: "Записи теряются на приёме ({{ $labels.reason }})"
          description: >-
            Отброшенное не повторяется и не восстанавливается. Причина
            в метке reason: queue_full и queue_bytes означают, что приём
            не успевает; wal_ack — что не удалось зафиксировать на диске.

      - alert: ОчередьПриёмаУПотолка
        # ⚠️ Окно в 15 минут, а не 5: всплеск на минуту-две — норма,
        # ради того очередь и заведена. Тревожит очередь, которая
        # НЕ РАССАСЫВАЕТСЯ между всплесками.
        expr: |
          min_over_time(watchgoose_ingest_queue_bytes[15m])
            / watchgoose_ingest_queue_bytes_limit > 0.8
        for: 15m
        labels: {severity: warning, component: ingest}
        annotations:
          summary: "Очередь приёма не опускается ниже 80%"
          description: >-
            Пятнадцать минут подряд очередь не опускалась ниже 80% потолка.
            Это уже не всплеск: приём не успевает за источниками, и роль
            ingest пора масштабировать.

      - alert: ЖурналПриёмаЗаполняется
        expr: watchgoose_wal_bytes / watchgoose_wal_max_bytes > 0.7
        for: 10m
        labels: {severity: warning, component: wal}
        annotations:
          summary: "Журнал приёма занят более чем на 70%"
          description: >-
            Журнал наполняется, когда Manticore не принимает записи.
            Заполнившись, он при on_full=backpressure начнёт отказывать
            источникам, при drop_oldest — вытеснять самое старое.

      - alert: ЖурналНеДоливается
        # Битые записи при доливке пропускаются; счётчик показывает,
        # сколько принятого не вернулось после перезапуска.
        expr: increase(watchgoose_wal_corrupt_records_total[1h]) > 0
        labels: {severity: warning, component: wal}
        annotations:
          summary: "При доливке журнала пропущены битые записи"
          description: >-
            Часть принятого не вернулась после перезапуска. Обычная причина —
            обрыв на середине записи при жёстком падении; повторяющиеся
            срабатывания означают проблему с диском.

  # ── Качество разбора ─────────────────────────────────────────────────
  - name: watchgoose-quality
    interval: 1m
    rules:
      - alert: ПотолокПаттерновБлизко
        # ⚠️ Вырождение БЕЗЗВУЧНОЕ, и потому это правило важнее, чем
        # выглядит.
        #
        # Выбрав потолок, разбор не падает и не ругается: шаблоном
        # становится само сообщение. Отпечатки остаются устойчивыми,
        # но перестают склеиваться — инциденты дробятся, накопленное
        # знание к новым отпечаткам не привязывается. Продукт продолжает
        # работать и тихо теряет главное своё свойство.
        expr: |
          watchgoose_fingerprint_clusters / watchgoose_fingerprint_clusters_max > 0.7
        for: 30m
        labels: {severity: warning, component: fingerprint}
        annotations:
          summary: "Кластеры паттернов заняты более чем на 70%"
          description: >-
            Поднимите ingest.fingerprint.max_clusters. Ориентир для тысячи
            сервисов — 50 000: тысяча сервисов это тысяча кодовых баз,
            и пяти шаблонов на сервис не бывает.

      - alert: ЗаписиБезОбязательныхАтрибутов
        expr: |
          sum(rate(watchgoose_ingest_invalid_total[1h])) by (service) > 0
        for: 6h
        labels: {severity: info, component: ingest}
        annotations:
          summary: "Сервис {{ $labels.service }} шлёт неполные записи"
          description: >-
            Шесть часов подряд без обязательного набора атрибутов.
            В режиме warn такие записи принимаются, но связать их
            со спанами сервиса будет нечем.

  # ── Место ────────────────────────────────────────────────────────────
  - name: watchgoose-storage
    interval: 5m
    rules:
      - alert: ГлубинаХраненияПадает
        # Предупреждает ЗА НЕДЕЛЮ до того, как начнёт удаляться нужное.
        expr: watchgoose_retention_forecast_days < 7
        for: 30m
        labels: {severity: warning, component: retention}
        annotations:
          summary: "Логов хватит меньше чем на неделю"
          description: >-
            При текущем притоке бюджет исчерпается за
            {{ $value | printf "%.1f" }} суток. Либо поднимайте disk_budget,
            либо проверьте, что архив не отстал: сутки без подтверждения
            в архиве не удаляются НИКОГДА, и ротации будет нечего забрать.

      - alert: АрхивОтстал
        expr: time() - watchgoose_archive_last_day_seconds > 172800
        for: 1h
        labels: {severity: warning, component: archive}
        annotations:
          summary: "Архив отстаёт больше чем на двое суток"
          description: >-
            Ротация не удаляет сутки, не подтверждённые в архиве. Пока архив
            отстаёт, бюджет расходуется без возможности освободить место,
            и приём в итоге начнёт отказывать.

      - alert: РазделЗаканчивается
        # ⚠️ Считается по РАЗДЕЛУ, а не по бюджету.
        #
        # Бюджет распределяет доли между хранилищами и не видит ни очередь
        # коллектора, ни архивную подготовку, ни чужие данные на том же
        # диске. Ротация по нему тоже не запускается. Это единственное
        # правило, которое смотрит на диск как таковой.
        expr: |
          node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 15m
        labels: {severity: critical, component: disk}
        annotations:
          summary: "На разделе меньше 15% свободного места"
          description: >-
            Проверьте очередь коллектора (/var/lib/otelcol): во время сбоя
            приёма она растёт и в расчёт бюджета не входит.

  # ── Метрики о метриках ───────────────────────────────────────────────
  - name: watchgoose-cardinality
    interval: 5m
    rules:
      - alert: ВзрывКардинальности
        # Порождается spanmetrics при непошаблоненных именах операций.
        expr: vm_hourly_series_limit_current_series / vm_hourly_series_limit_max_series > 0.8
        for: 30m
        labels: {severity: warning, component: metrics}
        annotations:
          summary: "Рядов метрик более 80% от потолка"
          description: >-
            Обычная причина — идентификатор в имени операции
            (GET /orders/8891 вместо /orders/:id). Лечится шаблонизацией
            в transform/span-names, а не поднятием потолка.

      - alert: РядыОтбрасываются
        expr: increase(vm_hourly_series_limit_rows_dropped_total[1h]) > 0
        labels: {severity: critical, component: metrics}
        annotations:
          summary: "VictoriaMetrics отбрасывает ряды по потолку"
          description: >-
            Потолок достигнут, часть метрик не записывается. Найдите
            источник кардинальности прежде, чем поднимать предел.

  # ── Живость ──────────────────────────────────────────────────────────
  - name: watchgoose-up
    interval: 30s
    rules:
      - alert: СлужбаНедоступна
        expr: up == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} не отвечает на сбор метрик"
          description: >-
            Цель {{ $labels.instance }} недоступна три минуты. Если это
            watchgoose — логи сейчас копятся в очереди коллектора и будут
            доставлены после подъёма; проверьте, что она не переполняется.
